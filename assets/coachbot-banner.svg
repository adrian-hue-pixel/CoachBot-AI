<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .title { font: 700 56px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#title); background-size: 200%; animation: shimmer 4s linear infinite; }
    .sub   { font: 400 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; opacity: 0; animation: fadeUp 1s 0.8s forwards; }
    .beat  { fill: none; stroke: #22d3ee; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; filter: url(#glow); animation: draw 2.4s ease-out infinite; }
    .ring  { fill: none; stroke: #a3e635; stroke-width: 3; stroke-dasharray: 60 200; transform-origin: 800px 130px; animation: spin 6s linear infinite; }
    .ring2 { fill: none; stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 8 14; transform-origin: 800px 130px; animation: spin 10s linear infinite reverse; opacity: 0.6; }
    .bar   { fill: url(#bar); transform-box: fill-box; transform-origin: bottom; animation: pump 1.6s ease-in-out infinite; }
    .orb   { fill: #a3e635; filter: url(#glow); animation: float 5s ease-in-out infinite; }
    .scanline { fill: url(#scan); animation: sweep 3.5s linear infinite; }
    .pulse { fill: none; stroke: #22d3ee; stroke-width: 2; transform-origin: 130px 130px; animation: pulse 2.4s ease-out infinite; }

    @keyframes shimmer { to { background-position: 200% 0; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { 0% { stroke-dashoffset: 1; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pump { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-40px); opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-900px); } to { transform: translateX(900px); } }
    @keyframes pulse { 0% { r: 14; opacity: 0.9; } 100% { r: 60; opacity: 0; } }
  </style>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect class="scanline" x="0" y="0" width="300" height="260"/>

  <!-- floating particles -->
  <circle class="orb" cx="90"  cy="220" r="3" style="animation-delay:0s"/>
  <circle class="orb" cx="260" cy="230" r="2.5" style="animation-delay:1.2s"/>
  <circle class="orb" cx="520" cy="225" r="3" style="animation-delay:2.1s"/>
  <circle class="orb" cx="700" cy="235" r="2" style="animation-delay:0.6s"/>
  <circle class="orb" cx="860" cy="222" r="3" style="animation-delay:1.8s"/>

  <!-- pulse ring behind logo -->
  <circle class="pulse" cx="130" cy="130" r="14"/>
  <circle cx="130" cy="130" r="22" fill="#0e7490"/>
  <path d="M120 130 l6 6 l12 -14" fill="none" stroke="#a3e635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- title block -->
  <text class="title" x="180" y="120">CoachBot AI</text>
  <text class="sub" x="182" y="158">Your AI youth fitness coach · Gemini + Streamlit</text>

  <!-- heartbeat line across bottom -->
  <path class="beat" pathLength="1" d="M0 200 H300 L318 200 L332 170 L346 228 L362 180 L372 200 H900"/>

  <!-- bar chart (right) -->
  <g transform="translate(640 60)">
    <rect class="bar" x="0"   y="90" width="18" height="110" style="animation-delay:0s"/>
    <rect class="bar" x="30"  y="60" width="18" height="140" style="animation-delay:0.2s"/>
    <rect class="bar" x="60"  y="30" width="18" height="170" style="animation-delay:0.4s"/>
    <rect class="bar" x="90"  y="50" width="18" height="150" style="animation-delay:0.6s"/>
    <rect class="bar" x="120" y="10" width="18" height="190" style="animation-delay:0.8s"/>
  </g>

  <!-- orbiting rings -->
  <circle class="ring"  cx="800" cy="130" r="95"/>
  <circle class="ring2" cx="800" cy="130" r="110"/>
</svg>
