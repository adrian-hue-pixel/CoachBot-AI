name: CoachBot AI CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  wheels:
    name: Python 3.12 wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: "python -m pip install --only-binary=:all: -r requirements.txt"

  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -W error
        env:
          COACHBOT_BROWSER_TEST: "1"
          COACHBOT_EVIDENCE_DIR: ${{ runner.temp }}/coachbot-demo
      - name: Save desktop and mobile demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: coachbot-demo-screenshots
          path: ${{ runner.temp }}/coachbot-demo
          if-no-files-found: error
